name: API Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/**/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-checks:
    if: github.event.pull_request.draft == false
    name: PHPUnit Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, mysqli, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        id: cache-composer
        with:
          path: server/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - if: ${{ steps.cache-composer.outputs.cache-hit != 'true' }}
        name: Install dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: server

      - name: PHPUnit Tests
        run: vendor/bin/phpunit --no-coverage
        working-directory: server

      - name: PHPUnit Tests on MySQL
        run: vendor/bin/phpunit --no-coverage --testsuite MySQL
        working-directory: server
        env:
          database_tests_hostname: 127.0.0.1
          database_tests_port: 3306
          database_tests_database: tests
          database_tests_username: root
          database_tests_password: ''
          database_tests_DBDriver: MySQLi
          database_tests_DBPrefix: ''
