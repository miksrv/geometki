# Optimized images (/_next/image): one copy per format, Next renders each size only once
proxy_cache_path /var/cache/nginx/geometki-images levels=1:2 keys_zone=METKI_IMAGES:10m max_size=768m inactive=30d use_temp_path=off;

# Pages for crawlers: HTML from the cache for 12 h, people always get a fresh page (2026-10-17)
proxy_cache_path /var/cache/nginx/geometki-pages levels=1:2 keys_zone=METKI_PAGES:20m max_size=1g inactive=24h use_temp_path=off;

map $http_user_agent $metki_bad_bot {
    default 0;
    "~*(SemrushBot|AhrefsBot|DotBot|MJ12bot|CCBot|Bytespider|keys-so-bot|BLEXBot|DataForSeoBot|serpstatbot|Barkrowler|ExaSearchBot|KeenableBot|Reflectionbot)" 1;
    # 2026-11-08: a headless scraper through proxy networks, a not yet released Chrome 157 on Linux,
    # ~95k requests an hour (a landing page and ~40 /_next/data prefetches per IP). Exact match only
    "~^Mozilla/5\.0 \(X11; Linux x86_64\) AppleWebKit/537\.36 \(KHTML, like Gecko\) Chrome/157\.0\.0\.0 Safari/537\.36$" 1;
}

map $http_user_agent $metki_crawler {
    default 0;
    ""      1;
    "~*(bot|crawl|spider|slurp|facebookexternalhit|meta-externalagent|headless|python|curl|wget)" 1;
    # Chrome older than 140: scrapers with a browser user agent
    "~Chrome/(\d{1,2}|1[0-3]\d)\." 1;
}

map "$metki_crawler:$cookie_token" $metki_skip_cache {
    default 1;
    "1:"    0;
}

# The format Next picks for /_next/image from the Accept header (images.formats: avif, webp)
map $http_accept $metki_image_format {
    default         "";
    "~image/avif"   avif;
    "~image/webp"   webp;
}

# TEMPORARILY (1.18.3, 2026-11-06): a scraper posing as a browser walked every permutation of the
# category chips (`/places?category=a,b,c&offset=…`), ~50k uncacheable renders a day that burned
# the API host's CPU. A page load of a 2+ categories list goes to the first category's list, the
# rest of the query dropped. Chip switching on the site goes through /_next/data and is untouched
# The path is the decoded $uri and goes into Location: plain ASCII segments only (no CR/LF header
# injection); any other path (Cyrillic slugs) falls through to the same rule in proxy.ts
map "$uri|$arg_category" $metki_category_combo_redirect {
    default "";
    "~^(?<combo_path>(/en)?/places(/[A-Za-z0-9_.~-]*)*)\|(?<combo_first>[a-z_]+)(,|%2C)" "https://$host$combo_path?category=$combo_first";
}

# Upgrade only for websocket requests, so plain requests keep the upstream connection alive
map $http_upgrade $metki_connection {
    default upgrade;
    ""      "";
}

upstream metki_upstream {
  server 127.0.0.1:3005;
  keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    server_name geometki.com www.geometki.com;

    server_tokens off;

    root /var/www/geometki.com;

    index index.html index.htm;

    client_max_body_size 64M;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    proxy_http_version 1.1;

    # Hashed build files straight from the disk: immutable, Node never sees them.
    # The deploy keeps the previous builds' files for a week, so old pages still load theirs
    location /_next/static/ {
        alias /var/www/geometki.com/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_cache            METKI_IMAGES;
        proxy_cache_key        $host$request_uri$metki_image_format;
        proxy_ignore_headers   Cache-Control Expires Vary Set-Cookie;
        proxy_cache_valid      200 7d;
        proxy_cache_valid      any 1m;
        proxy_cache_lock       on;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
        add_header             X-Image-Cache $upstream_cache_status;

        proxy_set_header       Host $host;
        proxy_set_header       Connection "";
        proxy_pass             http://metki_upstream;
    }

    # For PM2 server NextJS application
    location / {
        if ($metki_bad_bot) { return 403; }
        if ($metki_category_combo_redirect) { return 301 $metki_category_combo_redirect; }

        proxy_cache            METKI_PAGES;
        proxy_cache_key        $host$request_uri;
        proxy_cache_bypass     $metki_skip_cache $http_upgrade;
        proxy_no_cache         $metki_skip_cache;
        proxy_ignore_headers   Cache-Control Expires;
        proxy_cache_valid      200 301 410 12h;
        # The place page answers 404 on any API error: a short TTL, so a blip does not stick for half a day
        proxy_cache_valid      404 1m;
        proxy_cache_lock       on;
        proxy_cache_use_stale  error timeout updating http_500 http_502 http_503;
        add_header             X-Page-Cache $upstream_cache_status;

        proxy_pass             http://metki_upstream;
        proxy_read_timeout     60;
        proxy_connect_timeout  60;
        proxy_redirect         off;

        proxy_set_header       Host $host;
        proxy_set_header       Upgrade $http_upgrade;
        proxy_set_header       Connection $metki_connection;
    }

    location = /sitemap.xml {
        rewrite ^ /sitemap last;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name *.geometki.com;

    return 301 https://geometki.com$request_uri;
}
