<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta
            name="robots"
            content="noindex"
        />
        <title>Геометки — нет подключения</title>
        <link
            rel="icon"
            href="/favicon.ico"
        />
        <!-- Shown by the service worker (public/sw.js) when a page can't be loaded without a network.
             Self-contained: no app scripts or styles, they may be missing from the cache. -->
        <script>
            ;(function () {
                var theme
                try {
                    theme = localStorage.getItem('theme')
                } catch (e) {}
                if (theme === 'dark' || theme === 'light') {
                    document.documentElement.setAttribute('data-theme', theme)
                }
            })()
        </script>
        <style>
            :root {
                --background: #f1f2f4;
                --surface: #ffffff;
                --text: #1f2328;
                --text-secondary: #6b7280;
                --main: #009df1;
                color-scheme: light;
            }
            :root[data-theme='dark'] {
                --background: #161718;
                --surface: #232426;
                --text: #e6e7e9;
                --text-secondary: #9ca3af;
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px))
                    calc(16px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px));
                background: var(--background);
                color: var(--text);
                font:
                    14px/1.5 -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    Roboto,
                    Helvetica,
                    Arial,
                    sans-serif;
            }
            main {
                width: 100%;
                max-width: 420px;
                padding: 32px 24px;
                border-radius: 12px;
                background: var(--surface);
                text-align: center;
            }
            img {
                width: 64px;
                height: 64px;
                border-radius: 14px;
            }
            h1 {
                margin: 16px 0 8px;
                font-size: 18px;
            }
            p {
                margin: 0 0 24px;
                color: var(--text-secondary);
            }
            button {
                height: 36px;
                padding: 0 20px;
                border: 0;
                border-radius: 8px;
                background: var(--main);
                color: #ffffff;
                font: inherit;
                font-weight: 500;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <img
                src="/android-chrome-192x192.png"
                alt=""
            />
            <h1 id="title">Нет подключения к интернету</h1>
            <p id="text">Страница откроется, как только связь появится.</p>
            <button
                id="retry"
                type="button"
            >
                Повторить
            </button>
        </main>
        <script>
            ;(function () {
                if (/^\/en(\/|$)/.test(location.pathname)) {
                    document.documentElement.lang = 'en'
                    document.title = 'Geometki — offline'
                    document.getElementById('title').textContent = 'No internet connection'
                    document.getElementById('text').textContent = 'The page will open as soon as you are back online.'
                    document.getElementById('retry').textContent = 'Try again'
                }
                document.getElementById('retry').addEventListener('click', function () {
                    location.reload()
                })
                window.addEventListener('online', function () {
                    location.reload()
                })
            })()
        </script>
    </body>
</html>
